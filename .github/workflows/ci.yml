name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and run tests
        run: make test

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: gcc
      ASAN_DETECT_LEAKS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and run sanitized tests
        run: make sanitize

  quality:
    name: Formatting, static analysis and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: gcc
      CLANG_FORMAT: clang-format-18
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check source formatting
        run: make check-format

      - name: Run GCC static analyzer
        run: make analyze

      - name: Run tests with coverage instrumentation
        run: make coverage
